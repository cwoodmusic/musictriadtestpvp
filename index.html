<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Triad — PvP Prototype</title>
<style>
:root{--ink:#27231d;--paper:#f8f3e6;--line:#8c7650;--you:#315b91;--opp:#9a3f3f}
*{box-sizing:border-box} body{margin:0;background:#eee8d8;color:var(--ink);font-family:Georgia,serif}
.wrap{max-width:980px;margin:auto;padding:20px}.panel{background:var(--paper);border:4px double var(--line);padding:18px;margin-bottom:16px}
h1{text-align:center;letter-spacing:.08em;margin:.2em 0}.sub{text-align:center;font-style:italic}
button,input{font:inherit;padding:10px 14px}button{cursor:pointer}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}.roomcode{font-size:2rem;font-weight:bold;letter-spacing:.2em;text-align:center}
.status{text-align:center;font-weight:bold;min-height:1.5em;margin:10px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:14px auto}
.slot{aspect-ratio:.78;border:2px solid #9d8d6e;background:#fffdf6;display:flex;align-items:center;justify-content:center;min-width:0}
.slot.open{cursor:pointer}.hand{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pick{width:105px;background:transparent;border:0;padding:0}.pick.sel{outline:4px solid #c29b39}
.card{position:relative;width:100%;aspect-ratio:.70;border:4px solid #555;border-radius:7px;background:#fffdf8}
.card.you{border-color:var(--you)}.card.opp{border-color:var(--opp)}
.edge{position:absolute;font-family:Arial,sans-serif;font-weight:bold;font-size:17px}.t{top:5px;left:50%;transform:translateX(-50%)}.b{bottom:5px;left:50%;transform:translateX(-50%)}.l{left:5px;top:50%;transform:translateY(-50%)}.r{right:5px;top:50%;transform:translateY(-50%)}
.legend{text-align:center;font-size:.9rem}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 5px 0 12px}.blue{background:var(--you)}.red{background:var(--opp)}
.err{color:#8b1e1e;text-align:center}.small{text-align:center;font-size:.9rem}
@media(max-width:600px){.wrap{padding:8px}.pick{width:82px}.edge{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<section id="lobby" class="panel">
<h1>♪ MUSIC TRIAD ♫</h1><div class="sub">PvP connection prototype</div>
<p class="small">Open this same page on two devices. One creates a game; the other joins with the room code.</p>
<div class="row"><button id="cpu">VS COMPUTER</button><button id="create">CREATE PvP GAME</button></div>
<hr>
<div class="row"><input id="code" maxlength="4" placeholder="ROOM CODE" autocomplete="off"><button id="join">JOIN GAME</button></div>
<div id="lobbyMsg" class="err"></div>
</section>

<section id="waiting" class="panel hidden">
<h1>WAITING FOR PLAYER 2</h1><div>Your room code is:</div><div id="roomCode" class="roomcode"></div>
<p class="small">Give this four-character code to the other player.</p>
</section>

<section id="game" class="panel hidden">
<h1>MUSIC TRIAD — PvP</h1>
<div class="legend"><span class="dot blue"></span>You <span class="dot red"></span>Opponent</div>
<div id="status" class="status"></div>
<div id="board" class="board"></div>
<h3 style="text-align:center">YOUR CARDS</h3><div id="hand" class="hand"></div>
<div class="row" style="margin-top:15px"><button id="leave">LEAVE GAME</button></div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, onValue, runTransaction, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyBc742bvSjZ3VIrJlH8WZ1UlGGCKFFENho",
 authDomain:"music-triad.firebaseapp.com",
 databaseURL:"https://music-triad-default-rtdb.firebaseio.com",
 projectId:"music-triad",
 storageBucket:"music-triad.firebasestorage.app",
 messagingSenderId:"276316405918",
 appId:"1:276316405918:web:d09c11c2422cf6bf95bb8f"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);
const $=s=>document.querySelector(s);
let uid=null, room=null, player=null, state=null, selected=null, unsub=null, cpuMode=false;

const symbols=[
 {id:"sn",k:"n",v:.25,label:"♬¼"}, {id:"en",k:"n",v:.5,label:"♪½"},
 {id:"qn",k:"n",v:1,label:"♩1"}, {id:"ee",k:"n",v:1,label:"♫1"},
 {id:"ssss",k:"n",v:1,label:"♬♬1"}, {id:"hn",k:"n",v:2,label:"𝅗𝅥2"},
 {id:"wn",k:"n",v:4,label:"𝅝4"}, {id:"er",k:"r",v:.5,label:"𝄾½"},
 {id:"qr",k:"r",v:1,label:"𝄽1"}, {id:"hr",k:"r",v:2,label:"𝄼2"},
 {id:"wr",k:"r",v:4,label:"𝄻4"}
];
const smap=Object.fromEntries(symbols.map(x=>[x.id,x]));
const rand=a=>a[Math.floor(Math.random()*a.length)];
function card(owner){return {owner,e:[rand(symbols).id,rand(symbols).id,rand(symbols).id,rand(symbols).id]}}
function hand(owner){return Array.from({length:5},()=>card(owner))}
function code4(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:4},()=>rand(a)).join("")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cardHTML(c,mine=false){if(!c)return "";const cls=mine?"you":"opp";return `<div class="card ${cls}"><span class="edge t">${esc(smap[c.e[0]].label)}</span><span class="edge r">${esc(smap[c.e[1]].label)}</span><span class="edge b">${esc(smap[c.e[2]].label)}</span><span class="edge l">${esc(smap[c.e[3]].label)}</span></div>`}
function attack(A,D){return A.k===D.k&&A.v>D.v}
const adj=[[-3,0,2],[1,1,3],[3,2,0],[-1,3,1]];
function valid(i,j,d){return j>=0&&j<9 && !(d===1&&i%3===2) && !(d===-1&&i%3===0)}
function applyMove(s,idx,c,p){
 s.board[idx]=structuredClone(c);
 for(const [d,ai,di] of adj){const j=idx+d;if(!valid(idx,j,d)||!s.board[j]||s.board[j].owner===p)continue;
   if(attack(smap[c.e[ai]],smap[s.board[j].e[di]]))s.board[j].owner=p;
 }
 s.hands[p].splice(c.handIndex,1); s.turn=1-p; s.moves++;
 if(s.moves>=9)s.finished=true;
 return s;
}
function publicState(){
 if(!state)return null;
 const x=structuredClone(state);
 if(player===0)x.hands[1]=x.hands[1].map(()=>null); else x.hands[0]=x.hands[0].map(()=>null);
 return x;
}
function show(id){["lobby","waiting","game"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==id))}
function listen(){
 if(unsub)unsub();
 unsub=onValue(ref(db,"rooms/"+room),snap=>{
   const v=snap.val(); if(!v){$("#lobbyMsg").textContent="That room no longer exists.";show("lobby");return}
   state=v.game||null;
   if(v.p2 && state){show("game");render()} else if(player===0){show("waiting");$("#roomCode").textContent=room}
 });
}
function render(){
 if(!state)return;
 const myTurn=state.turn===player&&!state.finished;
 $("#status").textContent=state.finished?resultText():myTurn?"YOUR TURN — choose a card, then a space.":"OPPONENT'S TURN";
 $("#board").innerHTML="";
 state.board.forEach((c,i)=>{const d=document.createElement("div");d.className="slot"+(!c&&myTurn&&selected!==null?" open":"");if(c)d.innerHTML=cardHTML(c,c.owner===player);if(!c&&myTurn&&selected!==null)d.onclick=()=>move(i);$("#board").appendChild(d)});
 $("#hand").innerHTML="";
 (state.hands[player]||[]).forEach((c,i)=>{const b=document.createElement("button");b.className="pick"+(selected===i?" sel":"");b.innerHTML=cardHTML(c,true);b.onclick=()=>{if(myTurn){selected=i;render()}};$("#hand").appendChild(b)});
}
function resultText(){let me=0,op=0;state.board.forEach(c=>{if(c)(c.owner===player?me++:op++)});return me>op?"YOU WIN!":me<op?"OPPONENT WINS!":"TIE GAME!"}
async function move(idx){
 if(selected===null)return;
 const sel=selected; selected=null;
 if(cpuMode){
   if(!state||state.finished||state.turn!==0||state.board[idx])return;
   const c=structuredClone(state.hands[0][sel]); if(!c)return;
   c.handIndex=sel; state=applyMove(state,idx,c,0); render();
   if(!state.finished)setTimeout(cpuMoveLocal,650);
   return;
 }
 const roomRef=ref(db,"rooms/"+room+"/game");
 await runTransaction(roomRef,g=>{
   if(!g||g.finished||g.turn!==player||g.board[idx])return;
   const c=g.hands[player][sel]; if(!c)return;
   c.handIndex=sel; return applyMove(g,idx,c,player);
 });
}

function startCpuGame(){
  cpuMode=true; room=null; player=0; selected=null;
  state={board:Array(9).fill(0),hands:[hand(0),hand(1)],turn:0,moves:0,finished:false};
  show("game"); render();
}
function cpuMoveLocal(){
  if(!cpuMode||!state||state.finished||state.turn!==1)return;
  const opens=state.board.map((c,i)=>c?null:i).filter(i=>i!==null);
  if(!opens.length)return;
  let best=null;
  for(let hi=0;hi<state.hands[1].length;hi++){
    for(const idx of opens){
      const test=structuredClone(state), c=structuredClone(test.hands[1][hi]); c.handIndex=hi;
      const before=test.board.filter(x=>x&&x.owner===1).length;
      applyMove(test,idx,c,1);
      const after=test.board.filter(x=>x&&x.owner===1).length;
      const score=after-before+Math.random()*.2;
      if(!best||score>best.score)best={hi,idx,score};
    }
  }
  if(best){
    const c=structuredClone(state.hands[1][best.hi]); c.handIndex=best.hi;
    state=applyMove(state,best.idx,c,1); render();
  }
}
async function createRoom(){
 cpuMode=false;
 $("#lobbyMsg").textContent="Creating room…";
 for(let tries=0;tries<8;tries++){
   const c=code4(), rr=ref(db,"rooms/"+c), snap=await get(rr); if(snap.exists())continue;
   room=c;player=0;
   const game={board:Array(9).fill(0),hands:[hand(0),hand(1)],turn:0,moves:0,finished:false};
   await set(rr,{p1:uid,created:Date.now(),game});
   onDisconnect(ref(db,"rooms/"+c+"/p1Online")).set(false); await set(ref(db,"rooms/"+c+"/p1Online"),true);
   listen();return;
 }
 $("#lobbyMsg").textContent="Couldn't create a room. Try again.";
}
async function joinRoom(){
 cpuMode=false;
 const c=$("#code").value.toUpperCase().replace(/[^A-Z2-9]/g,"").slice(0,4); if(c.length!==4){$("#lobbyMsg").textContent="Enter the 4-character room code.";return}
 const rr=ref(db,"rooms/"+c), snap=await get(rr); if(!snap.exists()){ $("#lobbyMsg").textContent="Room not found.";return}
 const v=snap.val(); if(v.p2&&v.p2!==uid){$("#lobbyMsg").textContent="That room already has two players.";return}
 room=c;player=1;await update(rr,{p2:uid,p2Online:true});onDisconnect(ref(db,"rooms/"+c+"/p2Online")).set(false);listen();
}
$("#cpu").onclick=startCpuGame; $("#create").onclick=createRoom; $("#join").onclick=joinRoom;
$("#code").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());
$("#leave").onclick=()=>{if(unsub)unsub();unsub=null;cpuMode=false;room=null;state=null;selected=null;show("lobby")};

(async()=>{try{const cred=await signInAnonymously(auth);uid=cred.user.uid;$("#lobbyMsg").textContent=""}catch(e){$("#lobbyMsg").textContent="Firebase sign-in failed: "+e.message}})();
</script>
</body></html>
